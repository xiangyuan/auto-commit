[package]
license = "MIT"
edition = "2021"
version = "2.0.0"
name = "auto-commit"
readme = "README.md"
categories = ["command-line-utilities", "development-tools"]
keywords = ["git", "commit", "ai", "openai", "llm"]
homepage = "https://github.com/clearclown/auto-commit"
repository = "https://github.com/clearclown/auto-commit"
description = "AI-powered Git commit message generator - supports OpenAI, DeepSeek, and Gemini"
authors = ["clearclown", "Miguel Piedrafita <soy@miguelpiedrafita.com>"]

[dependencies]
rand = "0.8.5"
serde = { version = "1.0.164", features = ["derive"] }
spinners = "4.1.0"
question = "0.2.2"
schemars = "0.8.12"
serde_json = "1.0.99"
env_logger = "0.10.0"
clap-verbosity-flag = "2.0.0"
log = { version = "0.4.8", features = ["std"] }
tokio = { version = "1.28.2", features = ["full"] }
clap = { version = "4.0.18", features = ["derive"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
dotenv = "0.15.0"
anyhow = "1.0"
thiserror = "1.0"
tempfile = "3.8"
dirs = "6.0.0"
async-trait = "0.1.89"

[dev-dependencies]
mockito = "1.1"
tempfile = "3.8"
serial_test = "3.0"
